openapi: 3.0.0
info:
  title: Task Visualization API
  version: 1.0.0
  description: API for retrieving and managing task history in the iOS Content Parser

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://your-domain.vercel.app
    description: Production

paths:
  /api/tasks:
    get:
      summary: Get paginated list of tasks
      description: |
        Retrieve a paginated list of parsing tasks with optional filtering.
        Tasks are returned in reverse chronological order (newest first).
      operationId: getTasks
      tags:
        - Tasks
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of tasks per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: platform
          in: query
          description: Filter by platform type
          schema:
            type: string
            enum: [xiaohongshu, bilibili, wechat, unknown]
        - name: status
          in: query
          description: Filter by task status
          schema:
            type: string
            enum: [success, failed, pending]
        - name: search
          in: query
          description: Search in task title or URL
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Successfully retrieved tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
              examples:
                success:
                  value:
                    tasks:
                      - id: "abc123-uuid"
                        title: "Amazing Xiaohongshu Post"
                        url: "https://xiaohongshu.com/explore/12345"
                        platform: "xiaohongshu"
                        status: "success"
                        timestamp: "2025-11-17T10:30:00Z"
                        content:
                          title: "Amazing Xiaohongshu Post"
                          content: "Full content here..."
                          images: ["https://example.com/image.jpg"]
                          aiEnhanced: true
                          summary: "This is a summary..."
                      - id: "def456-uuid"
                        title: "Failed Parse Attempt"
                        url: "https://invalid-url.com"
                        platform: "unknown"
                        status: "failed"
                        timestamp: "2025-11-17T09:15:00Z"
                        error:
                          message: "Failed to fetch content"
                          code: "FETCH_ERROR"
                    pagination:
                      currentPage: 1
                      pageSize: 20
                      totalTasks: 150
                      totalPages: 8
                      hasNextPage: true
                      hasPrevPage: false
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPage:
                  value:
                    error: "Invalid page parameter"
                    code: "INVALID_PARAM"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tasks/{id}:
    get:
      summary: Get single task by ID
      description: Retrieve detailed information for a specific task
      operationId: getTaskById
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Task UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - url
        - platform
        - status
        - timestamp
      properties:
        id:
          type: string
          format: uuid
          description: Unique task identifier
        title:
          type: string
          maxLength: 500
          description: Extracted or generated title
        url:
          type: string
          format: uri
          description: Original URL that was parsed
        platform:
          type: string
          enum: [xiaohongshu, bilibili, wechat, unknown]
          description: Detected platform type
        status:
          type: string
          enum: [success, failed, pending]
          description: Processing outcome
        timestamp:
          type: string
          format: date-time
          description: When parsing was completed (ISO 8601)
        content:
          $ref: '#/components/schemas/ParsedContent'
          description: Full parsing results (present if status=success)
        error:
          $ref: '#/components/schemas/TaskError'
          description: Error information (present if status=failed)
        metadata:
          $ref: '#/components/schemas/TaskMetadata'
          description: Optional additional context

    ParsedContent:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: Extracted content title
        content:
          type: string
          description: Main content text
        images:
          type: array
          items:
            type: string
            format: uri
          description: Array of image URLs
        author:
          type: string
          description: Content author/creator
        publishedAt:
          type: string
          format: date-time
          description: Original publish date
        aiEnhanced:
          type: boolean
          description: Whether AI enhancement was applied
        summary:
          type: string
          description: AI-generated summary
        tags:
          type: array
          items:
            type: string
          description: AI-generated tags
        optimizedTitle:
          type: string
          description: AI-optimized title

    TaskError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Error code for categorization
        stack:
          type: string
          description: Stack trace (dev/debug only)

    TaskMetadata:
      type: object
      properties:
        userAgent:
          type: string
          description: Client user agent
        ip:
          type: string
          description: Request IP (anonymized)
        duration:
          type: number
          description: Processing time in milliseconds
        aiModel:
          type: string
          description: AI model used (if applicable)

    TaskListResponse:
      type: object
      required:
        - tasks
        - pagination
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required:
        - currentPage
        - pageSize
        - totalTasks
        - totalPages
        - hasNextPage
        - hasPrevPage
      properties:
        currentPage:
          type: integer
          minimum: 1
          description: Current page number
        pageSize:
          type: integer
          minimum: 1
          description: Tasks per page
        totalTasks:
          type: integer
          minimum: 0
          description: Total number of tasks
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages
        hasNextPage:
          type: boolean
          description: Whether there is a next page
        hasPrevPage:
          type: boolean
          description: Whether there is a previous page

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
